name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release recovery {0} {1}', inputs.operation_id, inputs.request_digest) || format('Release {0}', github.ref_name) }}

# A semver tag (`v0.2.6`) pushed by a maintainer builds the macOS arm64
# and Intel binaries serially and publishes them, a SHA256SUMS file, a tap
# formula candidate, and the `latest.json` manifest as a GitHub Release. A
# default-branch dispatch safely resumes an existing immutable tag after a
# workflow defect is fixed. `latest.json` is inert release metadata retained
# for the independent control-plane asset validator; no local command consumes
# it as an updater manifest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation_id:
        description: Durable Maintainer operation UUID
        required: true
        type: string
      request_digest:
        description: SHA-256 of the complete durable Maintainer request
        required: true
        type: string
      expected_workflow_sha:
        description: Exact default-branch commit authorized to run recovery
        required: true
        type: string
      tag:
        description: Existing release tag to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    if: github.event_name == 'push' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha == inputs.expected_workflow_sha)
    # Only maintainers can push tags, so this is a trusted ref (same boundary
    # as CI's `push` to `main`, the only other trigger that reaches the
    # persistent Mac — every pull request, same-repository or a fork, runs
    # on a hosted runner instead; see ci.yml): the persistent Mac, warm
    # cache, real macOS arm64. The same trusted job cross-compiles Intel; a
    # matrix would allow two jobs to race one release and shared manifest.
    runs-on: dark-factory-mac
    timeout-minutes: 60
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself, so this job never
      # depends on that download — a plain `git fetch` talks straight to
      # GitHub's git server instead. See ci.yml for the full rationale;
      # this is the same step.
      #
      # This runner's workspace persists between jobs (it is shared with
      # ci.yml's `checks` job), and a prior job can leave more than stray
      # files behind if it was ever killed mid-checkout: a
      # `.git/index.lock`, a half-written pack, a stale shallow boundary.
      # `rm -rf .git && git init` before every fetch throws all of that
      # away in one move instead of trying to detect and repair each kind
      # of leftover state, then `git checkout --force --detach` lands on
      # the target commit and `git clean -ffdx` removes anything else a
      # prior job left in the working tree. That clean never touches the
      # shared Go caches, which live outside this workspace (see
      # docs/development/WORKFLOW.md, "The self-hosted runner").
      #
      # $GITHUB_SHA is the tag commit for a push and the protected default-
      # branch commit for a recovery dispatch. GitHub serves `git fetch` by
      # arbitrary commit SHA (verified against this repository). The repo is
      # public, so the fetch is unauthenticated and nothing is written to
      # .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Resolve the immutable release source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/prepare-release-source.sh "$REQUESTED_TAG"

      - name: Install the pinned toolchain
        run: |
          test "$(go env GOVERSION)" = go1.27.0

      - name: Check that the tag matches the runtime version
        run: |
          version=$(cat VERSION)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match VERSION $version" >&2
            exit 1
          fi

      - name: Build release binaries
        run: |
          set -eu
          version=$(cat VERSION)
          ldflags="-s -w -X github.com/dark-factory-build/dark-factory/internal/buildinfo.version=$version -X github.com/dark-factory-build/dark-factory/internal/buildinfo.source=$SOURCE_SHA"
          mkdir -p release/aarch64-apple-darwin release/x86_64-apple-darwin
          for binary in factoryd factory-runner factoryctl; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 GOENV=off GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags "$ldflags" \
              -o "release/aarch64-apple-darwin/$binary" "./cmd/$binary"
            CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 GOENV=off GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags "$ldflags" \
              -o "release/x86_64-apple-darwin/$binary" "./cmd/$binary"
          done
          for binary in factoryd factory-runner factoryctl; do
            test "$("release/aarch64-apple-darwin/$binary" --version)" = "$binary $version"
            go version -m "release/x86_64-apple-darwin/$binary" | grep -F 'GOARCH=amd64'
            go version -m "release/x86_64-apple-darwin/$binary" | grep -F 'GOOS=darwin'
          done

      - name: Package
        run: |
          ./scripts/package-release.sh "$TAG" dist "$GITHUB_REPOSITORY" \
            aarch64-apple-darwin release/aarch64-apple-darwin \
            x86_64-apple-darwin release/x86_64-apple-darwin

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$PUBLISHER" "$TAG" "$SOURCE_SHA" "$GITHUB_REPOSITORY" dist/*

      - name: Publish bounded workflow summary
        if: always()
        run: |
          if [ -x ./scripts/github-step-summary.sh ]; then
            DF_SUMMARY_KIND=release \
            DF_SUMMARY_REF="refs/tags/$TAG" \
            DF_SUMMARY_SHA="$SOURCE_SHA" \
            DF_SUMMARY_RESULT="${{ job.status }}" \
            DF_SUMMARY_TARGET="$TAG" \
            DF_SUMMARY_TARGET_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            DF_SUMMARY_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              ./scripts/github-step-summary.sh
          else
            # The checkout can fail before repository files exist. Keep this
            # immutable fallback static: no untrusted value is interpolated.
            {
              printf '%s\n' '### Dark Factory workflow summary'
              printf '%s\n' '- Result: <code>failure</code>'
              printf '%s\n' '- Ref: <code>unavailable before checkout</code>'
              printf '%s\n' '- SHA: <code>unavailable before checkout</code>'
              printf '%s\n' '- Release target: <code>unavailable before checkout</code>'
              printf '%s\n' '- Links: workflow run summary'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
