name: Release
run-name: Release ${{ github.ref_name }}

# A semver tag (`vX.Y.Z`) pushed by a maintainer builds the macOS arm64
# and Intel binaries serially and publishes them, a SHA256SUMS file, a tap
# formula candidate, and the `latest.json` manifest as a GitHub Release.
# `latest.json` is inert release metadata; no local command consumes it as an
# updater manifest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    # Publication authority runs on a fresh GitHub-hosted arm64 macOS worker,
    # never the owner's persistent machine or its provider credentials. One
    # job cross-compiles Intel so two publishers cannot race one manifest.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself, so this job never
      # depends on that download — a plain `git fetch` talks straight to
      # GitHub's git server instead. See ci.yml for the full rationale;
      # this is the same step.
      #
      # The hosted workspace starts empty. Reinitializing explicitly keeps the
      # checkout independent of action tarball availability and leaves no
      # credential in repository configuration.
      #
      # $GITHUB_SHA is the tag commit. GitHub serves `git fetch` by
      # arbitrary commit SHA (verified against this repository). The repo is
      # public, so the fetch is unauthenticated and nothing is written to
      # .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Resolve the immutable release source
        run: ./scripts/prepare-release-source.sh

      # Fresh arm64 images do not carry Go. Bootstrap it through the same
      # Homebrew boundary as CI, then expose that exact binary to later steps.
      - name: Provide the Homebrew Go toolchain
        run: |
          set -euxo pipefail
          if [ ! -x /opt/homebrew/bin/go ]; then
            brew update
            brew install go
          fi
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /opt/homebrew/bin/go version

      # One Go implementation (internal/buildinfo, shared with factoryd's
      # self-release) checks the tag against VERSION, cross-compiles both
      # targets with go.mod's toolchain, packages the five assets, and
      # publishes them. RELEASE_ARTIFACT is built from this workflow's commit.
      - name: Build release binaries
        run: |
          "$RELEASE_ARTIFACT" build "$TAG" "$SOURCE_SHA" release

      - name: Package
        run: |
          "$RELEASE_ARTIFACT" package "$TAG" "$SOURCE_SHA" dist "$GITHUB_REPOSITORY" \
            aarch64-apple-darwin release/aarch64-apple-darwin \
            x86_64-apple-darwin release/x86_64-apple-darwin

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RELEASE_ARTIFACT" publish "$TAG" "$SOURCE_SHA" "$GITHUB_REPOSITORY" dist/*

      - name: Publish bounded workflow summary
        if: always()
        run: |
          if [ -x ./scripts/github-step-summary.sh ]; then
            DF_SUMMARY_KIND=release \
            DF_SUMMARY_REF="refs/tags/$TAG" \
            DF_SUMMARY_SHA="$SOURCE_SHA" \
            DF_SUMMARY_RESULT="${{ job.status }}" \
            DF_SUMMARY_TARGET="$TAG" \
            DF_SUMMARY_TARGET_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            DF_SUMMARY_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              ./scripts/github-step-summary.sh
          else
            # The checkout can fail before repository files exist. Keep this
            # immutable fallback static: no untrusted value is interpolated.
            {
              printf '%s\n' '### Dark Factory workflow summary'
              printf '%s\n' '- Result: <code>failure</code>'
              printf '%s\n' '- Ref: <code>unavailable before checkout</code>'
              printf '%s\n' '- SHA: <code>unavailable before checkout</code>'
              printf '%s\n' '- Release target: <code>unavailable before checkout</code>'
              printf '%s\n' '- Links: workflow run summary'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
