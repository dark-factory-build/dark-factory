name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Mac runner
        type: choice
        default: dark-factory-mac
        options: [dark-factory-mac, macos-latest]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      macos_mode: ${{ steps.select.outputs.macos_mode }}
      control_plane: ${{ steps.select.outputs.control_plane }}
      relay: ${{ steps.select.outputs.relay }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - name: Select fixed gates from the combined tree
        id: select
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then printf '%s\n' macos=true macos_mode=full control_plane=true relay=true >>"$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then printf '%s\n' macos=true macos_mode=warm control_plane=true relay=false >>"$GITHUB_OUTPUT"; exit 0; fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid merge-group commit" >&2; exit 1; }
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --filter=blob:none origin refs/heads/main:refs/remotes/origin/main "$GITHUB_SHA"
          merge_base=$(git merge-base refs/remotes/origin/main "$GITHUB_SHA")
          git diff --check "$merge_base" "$GITHUB_SHA"
          git diff --name-only -z --no-renames --diff-filter=ACDMRTUXB "$merge_base" "$GITHUB_SHA" \
            >"$RUNNER_TEMP/changed-paths"
          macos=false; macos_mode=none
          control_plane=false
          relay=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|README.md|ARCHITECTURE.md|CONTRIBUTING.md|ROADMAP.md|SECURITY.md|CLAUDE.md|LICENSE|LICENSE.*|launchd/README.md)
                ;;
              control-plane|control-plane/*)
                macos=true
                control_plane=true
                ;;
              relay|relay/*)
                macos=true
                relay=true
                ;;
              *)
                macos=true
                ;;
            esac
          done <"$RUNNER_TEMP/changed-paths"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            macos_mode=affected
            printf 'base=%s\n' "$merge_base" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            macos_mode=warm
          else
            macos_mode=full
          fi
          {
            printf 'macos=%s\n' "$macos"
            printf 'macos_mode=%s\n' "$macos_mode"
            printf 'control_plane=%s\n' "$control_plane"
            printf 'relay=%s\n' "$relay"
          } >>"$GITHUB_OUTPUT"
  checks:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.macos == 'true'
    runs-on: ${{ github.event_name != 'workflow_dispatch' && 'macos-latest' || inputs.runner || 'dark-factory-mac' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.macos_mode == 'full' && '["daemon","packages","source"]' || '["source"]') }}
    steps:
      - name: Check out $GITHUB_SHA
        env:
          AFFECTED_BASE: ${{ needs.scope.outputs.base }}
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA" ${AFFECTED_BASE:+"$AFFECTED_BASE"}
          git checkout --force --detach "$GITHUB_SHA"
          git clean -ffdx
      - name: Provide the Go toolchain
        run: |
          set -euo pipefail
          case $(uname -m) in
            arm64) go_arch=arm64 ;;
            x86_64) go_arch=amd64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          go_archive=go1.27.2.darwin-$go_arch.tar.gz
          curl --fail --silent --show-error --location "https://dl.google.com/go/$go_archive" -o "$RUNNER_TEMP/$go_archive"
          checksum=$(curl --fail --silent --show-error --location "https://dl.google.com/go/$go_archive.sha256")
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$go_archive" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/go"
          tar -xzf "$RUNNER_TEMP/$go_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/go/bin/go" version
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Provide an isolated Node and Corepack pair
        run: |
          set -euo pipefail
          case $(uname -m) in
            arm64) node_arch=arm64 ;;
            x86_64) node_arch=x64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          node_release=node-v22.20.0-darwin-$node_arch
          node_archive=$node_release.tar.gz
          node_url=https://nodejs.org/dist/v22.20.0
          curl --fail --silent --show-error --location "$node_url/$node_archive" -o "$RUNNER_TEMP/$node_archive"
          curl --fail --silent --show-error --location "$node_url/SHASUMS256.txt" -o "$RUNNER_TEMP/node-shasums.txt"
          checksum=$(awk -v archive="$node_archive" '$2 == archive { print }' "$RUNNER_TEMP/node-shasums.txt")
          test -n "$checksum"
          (cd "$RUNNER_TEMP" && printf '%s\n' "$checksum" | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/$node_archive" -C "$RUNNER_TEMP"
          node_bin=$RUNNER_TEMP/$node_release/bin
          "$node_bin/node" --version
          "$node_bin/node" "$node_bin/corepack" --version
          printf '%s\n' "$node_bin" >> "$GITHUB_PATH"
          printf 'DF_CI_NODE=%s/node\nDF_CI_COREPACK=%s/corepack\n' "$node_bin" "$node_bin" >> "$GITHUB_ENV"
      - name: Name reusable caches
        id: cache-toolchain
        run: |
          printf 'DF_CI_CACHE_ROOT=%s/dark-factory-ci-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'go=%s\n' "$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore reusable compiler and package caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/dark-factory-ci-cache/go-build
            ${{ runner.temp }}/dark-factory-ci-cache/go-mod
            ${{ runner.temp }}/dark-factory-ci-cache/corepack
            ${{ runner.temp }}/dark-factory-ci-cache/pnpm-store
          key: ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchain.outputs.go }}-node22.20.0-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', 'web/package.json') }}-${{ github.sha }}
          restore-keys: |
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchain.outputs.go }}-node22.20.0-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', 'web/package.json') }}-
      - name: Run the macOS source gate
        env:
          MACOS_MODE: ${{ needs.scope.outputs.macos_mode }}
          AFFECTED_BASE: ${{ needs.scope.outputs.base }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$MACOS_MODE" in
            warm) ./scripts/local-ci.sh --warm ;;
            affected) ./scripts/local-ci.sh --affected "$AFFECTED_BASE" ;;
            full) ./scripts/local-ci.sh --full "$SHARD" ;;
            *) echo "unknown macOS gate mode: $MACOS_MODE" >&2; exit 1 ;;
          esac 2>&1 | tee "$RUNNER_TEMP/macos-gate.log"
      - name: Save the warm main-branch cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/dark-factory-ci-cache/go-build
            ${{ runner.temp }}/dark-factory-ci-cache/go-mod
            ${{ runner.temp }}/dark-factory-ci-cache/corepack
            ${{ runner.temp }}/dark-factory-ci-cache/pnpm-store
          key: ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-toolchain.outputs.go }}-node22.20.0-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', 'web/package.json') }}-${{ github.sha }}
      - name: Annotate failing tests
        if: failure()
        run: |
          grep -E '^[[:space:]]*(--- FAIL: |not ok |✖ )' "$RUNNER_TEMP/macos-gate.log" | head -n 10 |
            sed -e 's/^[[:space:]]*//' -e 's/%/%25/g' -e 's/^/::error title=Failing test::/' || true
  required:
    if: always()
    needs: [scope, checks, control-plane, relay, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every hosted source gate
        if: github.event_name != 'push' && (needs.scope.result != 'success' || (needs.scope.outputs.macos == 'true' && needs.checks.result != 'success') || (needs.scope.outputs.control_plane == 'true' && needs.control-plane.result != 'success') || (needs.scope.outputs.relay == 'true' && needs.relay.result != 'success'))
        run: |
          echo "required source gates failed: scope=${{ needs.scope.result }}, macOS=${{ needs.checks.result }}, control-plane=${{ needs.control-plane.result }}, relay=${{ needs.relay.result }}" >&2
          exit 1
      - name: Confirm the pull request is eligible for the queue
        if: github.event_name == 'pull_request'
        run: echo "pull request patch is eligible for combined-tree testing"
      - name: Confirm all hosted source gates passed
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: echo "every selected combined-tree gate passed"
      - name: Require a recorded adversarial review verdict
        if: needs.review.result != 'success' && (github.event_name == 'merge_group' || needs.review.result != 'skipped')
        run: |
          echo "no adversarial review verdict at the head being merged (review=${{ needs.review.result }})" >&2
          echo "  A reviewer that did not write the change records:" >&2
          echo "  Publish a GitHub review at this exact commit with Dark-Factory-Review: allow <head_sha>" >&2
          exit 1
  review:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the gate from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${DEFAULT_BRANCH}"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx
      - name: Verify the adversarial review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DF_REVIEW_TRUSTED_PUBLISHERS: ${{ vars.DF_REVIEW_TRUSTED_PUBLISHERS }}
        run: |
          set -euo pipefail
          gate="${RUNNER_TEMP}/gate"
          go build -o "${gate}" ./internal/review/gate
          number="$("${gate}" --pull-number)"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/reviews" --paginate \
            --jq '.[] | [.commit_id, .state, (.user.id | tostring), ((.body // "") | gsub("[\n\r\t]"; " ")), .author_association] | @tsv' \
            >"${RUNNER_TEMP}/reviews.tsv"
          DF_REVIEW_HEAD_SHA="${head}" DF_REVIEW_REVIEWS="${RUNNER_TEMP}/reviews.tsv" \
            "${gate}"
  control-plane:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.control_plane == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Restore control-plane Rust and tool caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            control-plane/target
            control-plane/.tools
          key: control-plane-v1-${{ runner.os }}-${{ runner.arch }}-rust1.88.0-worker-build0.8.5-wasm-bindgen0.2.125-${{ hashFiles('control-plane/Cargo.lock', 'control-plane/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            control-plane-v1-${{ runner.os }}-${{ runner.arch }}-rust1.88.0-worker-build0.8.5-wasm-bindgen0.2.125-${{ hashFiles('control-plane/Cargo.lock', 'control-plane/Cargo.toml') }}-
      - name: Verify the supported Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Run the control-plane authoritative gate
        run: ./control-plane/scripts/local-ci.sh
      - name: Save the warm main-branch control-plane cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            control-plane/target
            control-plane/.tools
          key: control-plane-v1-${{ runner.os }}-${{ runner.arch }}-rust1.88.0-worker-build0.8.5-wasm-bindgen0.2.125-${{ hashFiles('control-plane/Cargo.lock', 'control-plane/Cargo.toml') }}-${{ github.sha }}
  relay:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.relay == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx
      - name: Verify the supported Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Run the relay gate
        run: ./relay/scripts/local-ci.sh
