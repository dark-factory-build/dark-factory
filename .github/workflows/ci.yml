name: CI

on:
  pull_request:
  # A merge queue tests `main` + every entry ahead in the queue + this one,
  # on a temporary `gh-readonly-queue/**` ref, and merges only if that exact
  # combination is green. Without this trigger the queue would wait forever
  # for a `required` context that never reports.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # Never cancel a queue run: the merge it gates would be left waiting on a
  # context that will never report, stalling every entry behind it.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # The macOS job is the release-compatible source gate. Linux uses the same
  # shared Rust source-gate seam with an explicit source-only mode; macOS
  # release/publisher/package fixtures stay macOS-only until #142/#143.
  #
  # `runs-on` below is a policy, not a mechanism: a pull request runs the
  # workflow file it carries, so this expression only governs a PR that
  # leaves it unmodified — see docs/development/WORKFLOW.md, "CI and
  # GitHub" for the full trust boundary (fork approval, same-repository
  # PRs, workflow_dispatch, and the persistent runner's own isolation as a
  # tracked follow-up). Not duplicated here on purpose, so there's one
  # place to keep accurate instead of two.
  checks:
    # `merge_group` is grouped with `pull_request`, not left to the fallback.
    # A queue run gates a merge exactly as a pull request does, so it belongs
    # on the ephemeral hosted runner; letting it fall through would quietly
    # route every gating run onto the persistent shared runner (#54).
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'macos-latest' || 'dark-factory-mac' }}
    timeout-minutes: 45
    steps:
      # No actions/checkout: codeload.github.com (which serves an action's
      # tarball) can 429 independently of git itself and has, for over an
      # hour at a time, on this runner — with no code checked out and
      # nothing to retry. A plain `git fetch` talks straight to GitHub's
      # git server instead, so this job never depends on that download.
      #
      # This runner's workspace persists between jobs, and the
      # `cancel-in-progress` concurrency group above can SIGTERM a job
      # mid-checkout (an ordinary fixup push while the previous push's
      # `checks` is still running), so a prior job can leave more than
      # stray files behind: a `.git/index.lock`, a half-written pack, a
      # stale shallow boundary. `rm -rf .git && git init` before every
      # fetch throws all of that away in one move instead of trying to
      # detect and repair each kind of leftover state, then `git checkout
      # --force --detach` lands on the target commit and `git clean -ffdx`
      # removes anything else a prior job left in the working tree. That
      # clean never touches the cargo cache: CARGO_TARGET_DIR lives outside
      # this workspace (see docs/development/WORKFLOW.md, "The self-hosted
      # runner").
      #
      # $GITHUB_SHA is the PR's merge commit for `pull_request` events and
      # the pushed commit for `push`/`workflow_dispatch`; GitHub serves
      # `git fetch` by arbitrary commit SHA either way, including a PR's
      # hidden merge-commit ref (verified against this repository). The
      # repo is public, so the fetch is unauthenticated and nothing is
      # written to .git/config that could leak a credential.
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the macOS source gate
        run: ./scripts/local-ci.sh

      - name: Run the macOS causal source smoke
        run: |
          cargo +1.88.0 build --locked --workspace
          ./scripts/macos-contributor-smoke.sh
          ./scripts/test-macos-contributor-smoke.sh

      - name: Run the disposable launchd release proof
        run: ./scripts/macos-launchd-release-proof.sh

      - name: Publish bounded workflow summary
        if: always()
        env:
          DF_SUMMARY_KIND: CI
          DF_SUMMARY_REF: ${{ github.ref }}
          DF_SUMMARY_SHA: ${{ github.sha }}
          DF_SUMMARY_RESULT: ${{ job.status }}
          DF_SUMMARY_TARGET: ${{ github.event.pull_request.milestone.title || 'unassigned' }}
          DF_SUMMARY_TARGET_URL: ${{ github.event.pull_request.milestone.html_url || format('{0}/{1}/milestones', github.server_url, github.repository) }}
          DF_SUMMARY_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          if [ -x ./scripts/github-step-summary.sh ]; then
            ./scripts/github-step-summary.sh
          else
            # The checkout can fail before repository files exist. Keep this
            # immutable fallback static: no untrusted value is interpolated.
            {
              printf '%s\n' '### Dark Factory workflow summary'
              printf '%s\n' '- Result: <code>failure</code>'
              printf '%s\n' '- Ref: <code>unavailable before checkout</code>'
              printf '%s\n' '- SHA: <code>unavailable before checkout</code>'
              printf '%s\n' '- Release target: <code>unavailable before checkout</code>'
              printf '%s\n' '- Links: workflow run summary'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  # The repository's single required context is deliberately an aggregate:
  # GitHub must require both hosted runtime source gates and the separately
  # deployed control-plane gate, not just whichever job name happened to be
  # selected when the ruleset was first configured.
  required:
    if: always()
    needs: [checks, linux, control-plane, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both hosted source gates
        if: needs.checks.result != 'success' || needs.linux.result != 'success' || needs.control-plane.result != 'success'
        run: |
          echo "required source gates failed: macOS=${{ needs.checks.result }}, Linux=${{ needs.linux.result }}, control-plane=${{ needs.control-plane.result }}" >&2
          exit 1
      - name: Confirm all hosted source gates passed
        run: echo "macOS, Linux, and control-plane source gates passed"

      # AGENTS.md rule 2, made a merge condition rather than a convention.
      #
      # In the queue only `success` passes. Everywhere else `skipped` passes
      # too, because `review` runs only on `merge_group`: recording a verdict
      # fires no workflow event, so a pull-request-time run could never turn
      # green after the reviewer acted, and treating its `skipped` as a failure
      # would fail every pull request -- the same deadlock in a new costume.
      #
      # Keyed on the EVENT as well as the result, deliberately. Keying on the
      # result alone is safe only while `review` has no `needs:` and cannot be
      # dependency-skipped inside the queue -- a property of a different job
      # that a reader has to go and verify. This form says the policy outright
      # and cannot be undermined by a later edit to that job.
      #
      # So a pull request enqueues without a verdict and is ejected here, at
      # the one moment the verdict has to be true: against the head being
      # merged.
      - name: Require a recorded adversarial review verdict
        if: needs.review.result != 'success' && (github.event_name == 'merge_group' || needs.review.result != 'skipped')
        run: |
          echo "no adversarial review verdict at the head being merged (review=${{ needs.review.result }})" >&2
          echo "  A reviewer that did not write the change records:" >&2
          echo "  submit_pull_request_review, event: ALLOW, head_sha: <this exact head>" >&2
          exit 1

      # The adversarial-review gate runs on `merge_group` and nowhere else, so
      # the `merge_queue` rule is the single chokepoint keeping unreviewed work
      # out of this branch. If it lapses, `merge_group` stops firing, the gate
      # never runs on any event, and this aggregate stays green -- rule 2
      # silently stops being enforced with no red check anywhere.
      #
      # Asserted INLINE, deliberately, and this is the one place in the repo
      # where that is the safer arrangement. A pull request runs the workflow
      # file it carries, but the maintainer App is refused
      # `.github/workflows/` and `.github/` is owned in CODEOWNERS, so an
      # agent-authored change cannot weaken this without a human push and an
      # owner approval. A helper under `scripts/` would be App-publishable --
      # the weaker-protected file guarding the stronger-protected one, which is
      # exactly why `verify-adversarial-review.sh` is hoisted to the default
      # branch. Hoisting is not available here: it cannot work until the code
      # is already on the default branch, and this must hold from the first
      # run. So the assertion is kept small enough to review by eye instead.
      #
      # Read from the LIVE rules, not from `scripts/github-repo-settings.sh`:
      # that file records what an operator intended to apply, which is not
      # evidence that it is applied, and the two have already drifted once.
      # Rules in `evaluate` or `disabled` rulesets are not returned by this
      # endpoint, so a ruleset downgraded out of enforcement reads as absent.
      - name: Require the merge queue to still be the only path to this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Written to a file, not piped. `grep -q` exits on its first match
          # and closes the pipe; with `pipefail` a still-writing `printf` then
          # makes the pipeline 141 (SIGPIPE), and a rule that IS active reads
          # as absent. Latent here -- the projection is ~163 bytes against a
          # 64KB pipe buffer -- but it grows with required contexts and the
          # failure is silent and confusing when it arrives.
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BASE_BRANCH}" --jq '
            .[] | (("rule:" + .type),
                   (if .type=="merge_queue"
                    then "grouping:" + (.parameters.grouping_strategy // "none") else empty end),
                   (if .type=="required_status_checks"
                    then (.parameters.required_status_checks[]? | "context:" + .context) else empty end))' \
            >"${RUNNER_TEMP}/ruleset-facts.txt"
          require() {
            grep -qx "$1" "${RUNNER_TEMP}/ruleset-facts.txt" || {
              echo "chokepoint: '$1' is not active on ${BASE_BRANCH}" >&2
              echo "  $2" >&2
              echo "  Re-apply scripts/github-repo-settings.sh." >&2
              exit 1
            }
          }
          require rule:merge_queue \
            'The review gate runs only on merge_group; without the queue it never runs.'
          # ALLGREEN makes every entry's own group required. Under HEADGREEN the
          # per-entry groups are still built but stop being required, so
          # unreviewed entries ahead of the last would merge unchecked.
          require grouping:ALLGREEN \
            'Only the last entry of a group would be gated.'
          require rule:required_status_checks \
            'Nothing would require any check at all.'
          require context:required \
            'Nothing would require the aggregate the review gate reports through.'

  review:
    # The merge queue, and nowhere else.
    #
    # Recording a verdict fires no workflow event. A pull-request-time run
    # would therefore evaluate before the reviewer had acted, fail, and have
    # no way back to green: the only way to re-trigger it is to push, which
    # moves the head and orphans the verdict it was waiting for. There is no
    # ordering that ends green, so requiring it there would make every pull
    # request permanently unmergeable, and the release valve would be an admin
    # bypass -- the gate satisfied by circumventing it.
    #
    # The queue runs after the verdict exists, against the head being merged,
    # which is the one moment it has to be true. A pull request with no verdict
    # enqueues and is ejected when this fails.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Deliberately NOT $GITHUB_SHA. This runs the gate as it exists on the
      # default branch, never the copy carried by the change under review: the
      # maintainer App may publish under `scripts/`, so a pull request running
      # its own copy could weaken the reviewer about to judge it. A change to
      # the gate is still tested by `checks` and `linux`, which do run the
      # pull request's copy against test-verify-adversarial-review.sh.
      #
      # This hoists the decision, not the plumbing. Everything else on this
      # path -- the projection below, the head lookup, this job's existence --
      # still comes from the pull request's own `ci.yml`, exactly as the
      # comment on `checks` says. What bounds that is CODEOWNERS on `.github/`
      # plus the App's refusal to publish under `.github/workflows/`; note the
      # App's refusal is by named path, so `.github/actions/**` IS publishable
      # and a composite action extracted from this job would not be covered.
      - name: Check out the gate from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${DEFAULT_BRANCH}"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Verify the adversarial review verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both gating events name the pull request in GITHUB_REF, so this
          # job does not branch on the event.
          number="$(./scripts/verify-adversarial-review.sh --pull-number)"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')"
          # Projection only: four fields per review and no decision, so the
          # logic that gates every merge stays somewhere a test can drive it.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/reviews" --paginate \
            --jq '.[] | [.commit_id, .state, (.user.id | tostring), ((.body // "") | gsub("[\n\r\t]"; " "))] | @tsv' \
            >"${RUNNER_TEMP}/reviews.tsv"
          DF_REVIEW_HEAD_SHA="${head}" DF_REVIEW_REVIEWS="${RUNNER_TEMP}/reviews.tsv" \
            ./scripts/verify-adversarial-review.sh

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Verify the supported Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"

      - name: Run the control-plane authoritative gate
        run: ./control-plane/scripts/local-ci.sh

  # Ubuntu is the source-contributor preview gate. It keeps the macOS
  # compatibility gate above intact while making the Linux claim explicit:
  # x86-64 source builds, the shared deterministic Rust suite, and the public
  # factoryd/factoryctl/factory-tui shell smoke all run on Ubuntu.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out $GITHUB_SHA
        run: |
          set -euxo pipefail
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          git clean -ffdx

      - name: Verify Ubuntu x86-64 runner
        run: |
          set -euxo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Run the Linux authoritative gate
        run: ./scripts/local-ci.sh --linux-source

      # The gate has already compiled every target. Build only the normal
      # binaries that the following shell smoke executes, after clippy/tests
      # so the gate cannot invalidate and rebuild an up-front cargo build.
      - name: Build the workspace binaries
        run: cargo +1.88.0 build --locked --workspace --bins

      - name: Verify source-gate mode boundary
        run: ./scripts/test-local-ci-mode.sh

      - name: Verify repository settings proposal
        run: ./scripts/test-repository-settings.sh

      - name: Run the source contributor smoke
        run: ./scripts/linux-contributor-smoke.sh

      - name: Verify interrupted smoke teardown
        run: ./scripts/test-linux-contributor-smoke.sh
