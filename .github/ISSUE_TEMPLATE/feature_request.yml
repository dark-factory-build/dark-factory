name: Feature request
description: A capability Dark Factory should have
labels: ["enhancement", "factory:candidate"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The operator or agent workflow this unblocks, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Hypothesis (optional)
      description: "A guess to verify, not a specification. If useful, describe the shared operation you think could own runtime behavior, or the shared Go operation under internal/install that could work while the daemon is absent."
  - type: textarea
    id: live_signal
    attributes:
      label: Live acceptance signal
      description: How will we know this worked on the live factory? Name an observable signal.
    validations:
      required: true
  - type: textarea
    id: smaller
    attributes:
      label: What this lets us delete or simplify
      description: What becomes smaller or simpler? If the change only adds, say why that is still right.
